# ============================================================
# Smart Restaurant Campus — Nginx main configuration
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ============ MIME ============
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============ LOGS ============
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent",'
            '"referer":"$http_referer"'
        '}';

    access_log /var/log/nginx/access.log json;

    # ============ PERFORMANCE ============
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # ============ CLIENT ============
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;

    # ============ COMPRESSION ============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/wasm
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ============ SECURITY HEADERS ============
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;

    # ============ RATE LIMITING ============
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ============ UPSTREAMS ============
    upstream web {
        server web:3000;
        keepalive 32;
    }

    upstream admin {
        server admin:3001;
        keepalive 32;
    }

    upstream api {
        server api:9000;        # PHP-FPM
        keepalive 32;
    }

    upstream ai {
        server ai-services:8001;
        keepalive 32;
    }

    upstream reverb {
        server api:8080;        # Laravel Reverb WebSocket
    }

    # ============ INCLUDE SITE CONFIGS ============
    include /etc/nginx/conf.d/*.conf;
}
