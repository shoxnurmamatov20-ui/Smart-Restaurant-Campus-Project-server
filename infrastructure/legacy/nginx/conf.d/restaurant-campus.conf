# ============================================================
# Smart Restaurant Campus — Main site (web + api + ai + websocket)
# ============================================================

# ============ MAIN: web app ============
server {
    listen 80;
    listen [::]:80;
    server_name restaurant-campus.uz www.restaurant-campus.uz;

    # Redirect to HTTPS in production
    # return 301 https://$host$request_uri;

    # ============ Web (Next.js) ============
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ============ Laravel API ============
    #
    # REQUIRES SHARED VOLUME between this nginx container and the `api`
    # (PHP-FPM) container so `root /var/www/html/public` resolves on both.
    # In docker-compose.prod.yml mount the api source code into nginx as
    # read-only, for example:
    #
    #   services:
    #     api:
    #       volumes:
    #         - api_source:/var/www/html
    #     nginx:
    #       volumes:
    #         - api_source:/var/www/html:ro
    #   volumes:
    #     api_source:
    #
    # Without this mount, nginx cannot serve static Laravel assets and the
    # `try_files $uri` step always misses (only /index.php fallback works).
    # `fastcgi_pass api` still reaches PHP-FPM because SCRIPT_FILENAME uses
    # the same /var/www/html path that the api container actually has.
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        # PHP-FPM via fastcgi
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass api;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Auth endpoints — stricter rate limit
    location ~ ^/api/v1/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # ============ AI Services ============
    location /ai/ {
        limit_req zone=api burst=10 nodelay;

        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;        # AI calls can be slow
    }

    # ============ WebSocket (Reverb) ============
    location /app {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;       # Long-lived connections
    }

    # ============ Static files (Next.js public) ============
    location /_next/static/ {
        proxy_pass http://web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ============ MinIO (file storage) ============
    location /storage/ {
        rewrite ^/storage/(.*)$ /restaurant-campus/$1 break;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1h;
    }
}

# ============ ADMIN SUBDOMAIN ============
server {
    listen 80;
    listen [::]:80;
    server_name admin.restaurant-campus.uz;

    # Admin requires stricter security — recommend IP allowlist in production
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        limit_req zone=general burst=30 nodelay;

        proxy_pass http://admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
