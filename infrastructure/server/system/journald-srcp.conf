# Smart Restaurant Campus — bound the journal.
#
# Installed to /etc/systemd/journald.conf.d/srcp.conf by srcp-apply.
#
# The journal on this box had grown to 2.6 GB before anything capped it.
# systemd's own default is 10% of the filesystem, which on a 98 GB root is
# 9.8 GB of logs nobody will ever read — and the space is not reclaimed until
# the limit is hit, so it reads as "the disk is filling up" for months first.
#
# 800 MB holds roughly a month of this application's output at its current rate.
# SystemKeepFree is the more important of the two: it is what stops the journal
# from being the reason a deploy fails for want of disk.

[Journal]
SystemMaxUse=800M
SystemKeepFree=2G
SystemMaxFileSize=100M
MaxRetentionSec=1month
Compress=yes
