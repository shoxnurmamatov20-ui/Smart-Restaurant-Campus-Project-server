# Smart Restaurant Campus — directories that must exist before a service starts.
#
# Installed to /etc/tmpfiles.d/srcp.conf by srcp-apply.
#
# /var/log/srcp is created by provision.sh as well. It is repeated here because
# provision.sh runs once and tmpfiles runs on every boot: if the directory is
# ever removed — by a cleanup script, by hand, by a filesystem restore — php-fpm
# fails to open its error log and the pool does not start, and the message that
# explains why goes to the log that could not be opened.
#
# adm as group, matching /var/log/nginx: members of adm read logs without sudo,
# which is the difference between diagnosing a 502 and asking someone else to.

d /var/log/srcp 0750 root adm -
