# The routing table, shared by the http and https server blocks.
#
# Installed to /etc/nginx/snippets/srcp-routes.conf by srcp-apply.
#
# Kept in its own file so the two servers cannot drift apart: a route added to
# only one of them is a route that works over the domain and 404s on the LAN,
# or the reverse, and that kind of bug is invisible until someone is standing
# at a terminal that cannot sign in.
#
#   /api/v1/*         -> Laravel        php-fpm   (198 routes)
#   /sanctum/*        -> Laravel        php-fpm
#   /broadcasting/*   -> Laravel        php-fpm
#   /app/<key>        -> Reverb          :8020   (WebSocket, kitchen + floor)
#   /up               -> Laravel health php-fpm
#   /horizon/*        -> queue dashboard, super-admin only
#   /telescope/*      -> debug dashboard, super-admin only
#   /pulse            -> metrics dashboard, gated
#   /livewire-*       -> Livewire endpoint the Pulse dashboard needs
#   /storage/dish/*   -> dish photographs, straight from disk, immutable
#   /storage/*        -> other uploads from disk, else Laravel's file route
#   /vendor/*         -> dashboard assets, straight from disk
#   /admin/*          -> platform console :3010  (Next.js, basePath /admin)
#   /                 -> staff console    :3000  (Next.js, no basePath)
#
# Why Laravel sits on /api/v1 and not /api: the staff console owns
# /api/auth/session — its own Next route handler, which is what puts the
# Sanctum token into an httpOnly cookie. Giving Laravel all of /api would
# shadow it and break signing in. /api/v1 is what Laravel's routes already use,
# so nothing is rewritten and nothing overlaps.
#
# The dashboards are exposed rather than firewalled because IP rules cannot work
# here: traffic from the domain arrives from the edge proxy, so `allow` on a LAN
# range would either let the whole internet through or lock the LAN out. They are
# gated in the application instead, on the `super-admin` role, and a guest is
# denied without the callback running — see HorizonServiceProvider::gate().

# ---------------------------------------------------------------------
# Laravel — dynamic routes, no filesystem lookup
# ---------------------------------------------------------------------
location ^~ /api/v1       { include /etc/nginx/snippets/srcp-fastcgi.conf; }
location ^~ /sanctum      { include /etc/nginx/snippets/srcp-fastcgi.conf; }
location ^~ /broadcasting { include /etc/nginx/snippets/srcp-fastcgi.conf; }
location = /up            { include /etc/nginx/snippets/srcp-fastcgi.conf; }

# ---------------------------------------------------------------------
# Uploaded media — served from disk, never through PHP.
#
# `artisan storage:link` (step 5 of srcp-deploy) points public/storage at
# shared/storage/app/public, which is where Laravel's `public` disk writes.
# Every request for a photograph used to go through php-fpm — Laravel's own
# file route, which reads the file into PHP and answers it with `no-store` —
# so a menu of two hundred dishes was two hundred PHP requests, each one a
# worker held for the duration of a mobile download, and none of them
# cacheable. nginx answers from the file directly: sendfile, a year of cache,
# no worker.
#
# Dish photographs are named by the hash of their content (see
# App\Support\Media\MediaStore), so an address never changes meaning and
# `immutable` is safe: a phone that has the file never asks again. Anything
# else under /storage gets a modest hour, and anything that is NOT on disk —
# the signed file route for private disks — still reaches PHP through the
# named location below.
#
# www-data reads the files because it is in the srcp group and srcp-deploy
# leaves storage `g=rX`; a file written `o=` would be a 403 that looks like a
# 404 from the outside, which is why the deploy script fixes modes itself.
# ---------------------------------------------------------------------
location ^~ /storage/dish/ {
    root /srv/srcp/current/apps/api/public;
    access_log off;
    expires 1y;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # An uploaded file is the one thing on this host a stranger chose the
    # bytes of. Everything here is re-encoded WebP, and this says so to the
    # browser as well: nothing under this prefix may run, embed or fetch.
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    try_files $uri =404;
}

location ^~ /storage/ {
    root /srv/srcp/current/apps/api/public;
    access_log off;
    expires 1h;

    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    try_files $uri @storage_app;
}

location @storage_app     { include /etc/nginx/snippets/srcp-fastcgi.conf; }

# The application's own health endpoints. `/up` is Laravel's stock liveness
# ping and says only that PHP answered; these three say whether the platform
# can actually work — database, cache, queue, storage, migrations and the event
# outbox — and /api/health/live and /api/health/ready are what an orchestrator
# probes separately. All three sit under the api prefix, so one prefix match
# covers them.
#
# They were unreachable through nginx: only /api/v1 was mapped, so /api/health
# fell through to the Next.js app and answered 404. Every monitor pointed at
# them was reading a 404 as "the site is up".
location ^~ /api/health   { include /etc/nginx/snippets/srcp-fastcgi.conf; }

# Operator dashboards. Each is gated on `super-admin`; a restaurant owner is an
# admin of their own business, not of the platform, and these show every tenant.
location ^~ /horizon      { include /etc/nginx/snippets/srcp-fastcgi.conf; }
location ^~ /telescope    { include /etc/nginx/snippets/srcp-fastcgi.conf; }
location ^~ /pulse        { include /etc/nginx/snippets/srcp-fastcgi.conf; }

# Livewire's asset and update endpoints. The prefix is hashed per application
# key (/livewire-3d223fbe today), so it is matched by its stable stem rather
# than written out — a rotated APP_KEY changes the hash and a literal prefix
# here would silently stop matching, leaving the Pulse dashboard blank.
location ^~ /livewire-    { include /etc/nginx/snippets/srcp-fastcgi.conf; }

# ---------------------------------------------------------------------
# Reverb — the WebSocket the kitchen display and the floor listen on.
#
# `/app/<app-key>` is where the Pusher protocol puts its handshake, so the path
# is not ours to choose. The trailing slash matters: `^~ /app` would also swallow
# any console route beginning with those three letters, and this must claim
# exactly the one endpoint.
#
# The matching HTTP side — `/apps/<id>/events`, which is how a queue worker
# publishes — is deliberately NOT exposed. Horizon reaches Reverb over the
# loopback, and an open publish endpoint is a way for anyone who learns the app
# key to put a docket on somebody's kitchen screen.
# ---------------------------------------------------------------------
location ^~ /app/ {
    include /etc/nginx/snippets/srcp-websocket.conf;
    access_log off;
}

# ---------------------------------------------------------------------
# Dashboard assets — published to public/vendor by `artisan horizon:publish`,
# served from disk rather than through PHP. Immutable because the publish step
# is part of a deploy and a new release is a new path.
# ---------------------------------------------------------------------
location ^~ /vendor/ {
    root /srv/srcp/current/apps/api/public;
    access_log off;
    expires 30d;

    # nginx's add_header does not merge across levels: the moment a location
    # declares one of its own, every add_header from the enclosing server block
    # stops applying to it. Without repeating them here, the dashboard's
    # JavaScript would be the only thing this host serves without nosniff — and
    # nosniff on a script is the one that actually matters.
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    try_files $uri =404;
}

# ---------------------------------------------------------------------
# The native app, handed out from the site itself.
#
# /srv/srcp/shared/downloads/ is outside every release on purpose: an APK is
# not built by `srcp-deploy` (it needs the Android SDK, a signing key and a
# quarter of an hour of Gradle), so it must not disappear when a release does.
# `srcp-apk` writes here; the Next page at /download reads the manifest beside
# the file to show version, size and checksum.
#
# The MIME type is the part that is easy to get wrong and invisible when you
# do: without it nginx answers `application/octet-stream`, and Chrome on
# Android then downloads the file without offering to install it — which, to
# a restaurant owner, reads as "the download did not work".
# ---------------------------------------------------------------------
# The manifest first, as an exact match, so it wins over the prefix below. A
# new APK keeps its version in the file name and may be cached for a day; the
# manifest must never be, or the page keeps announcing the previous one.
location = /downloads/manifest.json {
    alias /srv/srcp/shared/downloads/manifest.json;
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /downloads/ {
    alias /srv/srcp/shared/downloads/;
    access_log off;

    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;

    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    try_files $uri =404;
}

# ---------------------------------------------------------------------
# Next.js consoles
# ---------------------------------------------------------------------
location ^~ /admin {
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/srcp-proxy.conf;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/srcp-proxy.conf;
}
