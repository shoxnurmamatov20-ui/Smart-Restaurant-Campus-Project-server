# =====================================================================
# Smart Restaurant Campus — nginx site
#
# Installed to /etc/nginx/sites-available/srcp by srcp-apply, which also links
# it into sites-enabled and removes the older `mypos` site it replaces.
#
# ---------------------------------------------------------------------
# Where this host sits
#
# It is not the edge. The chain is:
#
#   browser --https--> edge proxy --http/1.0--> this box :80 --> app
#             (mypos.tashmedunitf.uz, 87.237.235.107 public, 40.47.1.200 on the LAN)
#
# The certificate for mypos.tashmedunitf.uz lives on that edge box, not here;
# there is no Let's Encrypt account or certificate on this machine and there
# does not need to be. This was worth writing down because the address this
# host answers on, 40.47.1.225, sits inside Microsoft's 40.47.0.0/16 and is
# used here as a private LAN address. Outbound traffic leaves through a
# different address entirely. So no public CA can validate anything against
# this box directly — and nothing needs it to.
#
# The practical consequence is the one below: port 80 must SERVE, not redirect.
# A `return 301 https://$host...` here sends the edge straight back to itself
# and the request loops until something gives up. If you are tempted to add
# one, the thing to fix is the edge, not this file.
#
# ---------------------------------------------------------------------
# Port 443
#
# Only for reaching the console directly on the LAN — a terminal that cannot
# resolve mypos.tashmedunitf.uz, or work done from the box itself. It uses an
# internal certificate from /etc/ssl/srcp, which encrypts the traffic but
# proves nothing to a browser that has not been told about the CA. That matters
# because the session cookie is marked `Secure`, and a browser silently discards
# a `Secure` cookie that arrives over plain http: signing in answers 200 and
# the login form simply reappears, with nothing in any log to say why. Over
# https — the edge's certificate or this one — it just works.
#
# Install /etc/ssl/srcp/ca.crt on a device and the warning goes away.
#
# Deliberately no HSTS. With a certificate the browser does not yet trust, HSTS
# turns a one-time warning into a wall with no way past it, and the console
# becomes unreachable from that browser until the header expires. If HSTS is
# wanted for the public name, it belongs on the edge, which holds the publicly
# trusted certificate.
# =====================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Believe the edge about the scheme and port the reader actually used; fall
# back to our own only when nothing was forwarded. See srcp-proxy.conf.
map $http_x_forwarded_proto $srcp_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_port $srcp_port {
    default $http_x_forwarded_port;
    ''      $server_port;
}

# PHP does not read X-Forwarded-Proto; it reads the HTTPS server variable, and
# only cares whether it is non-empty. `if_not_empty` on the fastcgi_param means
# an empty value here leaves it unset rather than setting it to "off", which is
# the form Laravel treats as plain http. See srcp-fastcgi.conf.
map $srcp_proto $srcp_fcgi_https {
    https on;
    default '';
}

# The stock combined format records the edge's address as the client and says
# nothing about the scheme, which makes "was this request https?" unanswerable
# after the fact. Both are in here, along with upstream timing so a slow route
# can be told apart from a slow network.
log_format srcp '$remote_addr fwd="$http_x_forwarded_for" proto=$srcp_proto host=$host '
                '"$request" $status $body_bytes_sent rt=$request_time urt="$upstream_response_time" '
                '"$http_referer" "$http_user_agent"';

# ---------------------------------------------------------------------
# Port 80 — what the edge proxy talks to. Serves; never redirects.
# ---------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mypos.tashmedunitf.uz 40.47.1.225 _;

    client_max_body_size 64m;

    # The exact version in the Server header is what tells a scanner which CVE
    # list to try first. Hiding it defends nothing by itself — the fix for a
    # vulnerable nginx is a patched nginx — but there is no reason to hand it out.
    server_tokens off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Checked against the source rather than assumed: neither console calls
    # getUserMedia, navigator.geolocation or PaymentRequest today, so denying
    # them costs nothing and stops an embedded third party asking on our behalf.
    # The one to watch is `camera` — the day table QR codes are scanned in the
    # browser rather than by a handset, this needs `camera=(self)` or the prompt
    # never appears and the failure looks like a broken scanner.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    access_log /var/log/nginx/srcp.access.log srcp;
    error_log  /var/log/nginx/srcp.error.log;

    # Left open so a certificate can be issued for a name pointed straight at
    # this box, should the edge ever stop being in front of it. Forwarded rather
    # than served from disk because there is no docroot on this server block,
    # which makes `certbot --standalone --http-01-port 8888` the form that works.
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
    }

    # php-fpm's own health endpoints. Loopback only: they report worker counts
    # and the slow-request queue, which is operational detail and nobody else's.
    #
    # Written out rather than including srcp-fastcgi.conf, because the pool
    # matches these on SCRIPT_NAME inside the FPM master and never runs a script.
    # Including the shared file would set SCRIPT_FILENAME to the front controller
    # as well, and the two directives would both be sent — harmless, but it reads
    # as though Laravel were involved, and it is not.
    location = /fpm-ping {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/srcp-fpm.sock;
        fastcgi_param SCRIPT_NAME /fpm-ping;
    }

    location = /fpm-status {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/srcp-fpm.sock;
        fastcgi_param SCRIPT_NAME /fpm-status;
    }

    include /etc/nginx/snippets/srcp-routes.conf;
}

# ---------------------------------------------------------------------
# Port 443 — direct LAN access, internal certificate. See the header note.
# ---------------------------------------------------------------------
server {
    # `listen ... http2` rather than the `http2 on;` directive: this is nginx
    # 1.18, and the standalone directive only arrived in 1.25.1.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/srcp/fullchain.crt;
    ssl_certificate_key /etc/ssl/srcp/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SRCP:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64m;

    # The exact version in the Server header is what tells a scanner which CVE
    # list to try first. Hiding it defends nothing by itself — the fix for a
    # vulnerable nginx is a patched nginx — but there is no reason to hand it out.
    server_tokens off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Checked against the source rather than assumed: neither console calls
    # getUserMedia, navigator.geolocation or PaymentRequest today, so denying
    # them costs nothing and stops an embedded third party asking on our behalf.
    # The one to watch is `camera` — the day table QR codes are scanned in the
    # browser rather than by a handset, this needs `camera=(self)` or the prompt
    # never appears and the failure looks like a broken scanner.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    access_log /var/log/nginx/srcp.access.log srcp;
    error_log  /var/log/nginx/srcp.error.log;

    include /etc/nginx/snippets/srcp-routes.conf;
}
