# WebSocket proxy for Laravel Reverb.
#
# Installed to /etc/nginx/snippets/srcp-websocket.conf by srcp-apply.
#
# Separate from srcp-proxy.conf rather than a flag on it, because two of the
# settings there are actively wrong for a socket that is meant to stay open all
# shift:
#
#   proxy_read_timeout 60s   A Pusher client is silent between pings. Reverb's
#                            activity timeout is 60s and nginx's read timeout is
#                            the same, so the two race — and when nginx wins, the
#                            kitchen display drops its connection every minute
#                            and reconnects. It works, and it looks like a bug
#                            nobody can reproduce.
#
#   proxy_buffering on       Buffering a stream means holding frames back until
#                            there are enough of them. For a docket, "enough of
#                            them" arrives after the cook has already walked away.
#
# The forwarded headers are kept: Reverb signs channel authorisation against the
# host, and the Pusher handshake carries the app key in the path.

proxy_http_version 1.1;
proxy_pass http://127.0.0.1:8020;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $srcp_proto;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# An hour, which is longer than any shift's idle stretch and short enough that a
# socket whose client vanished without a FIN is eventually reclaimed. The client
# pings well inside it; this is the backstop, not the mechanism.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;

proxy_hide_header X-Powered-By;
