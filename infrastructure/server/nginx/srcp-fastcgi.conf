# Shared FastCGI block for every location Laravel answers.
#
# Installed to /etc/nginx/snippets/srcp-fastcgi.conf by srcp-apply.
#
# ---------------------------------------------------------------------
# Why there is no `try_files` here
#
# Every prefix that includes this file — /api/v1, /sanctum, /broadcasting, /up,
# /horizon, /pulse, /telescope, /livewire-* — is a *route*, not a file on disk.
# A `try_files $uri /index.php...` would make nginx stat a path that can never
# exist, on every request, and would need a `root` in each location just to make
# that stat resolve. The two static trees Laravel does own (public/vendor and
# public/build) get their own location with a real `root` instead.
#
# The consequence is that SCRIPT_FILENAME must be written out in full rather
# than composed from $fastcgi_script_name, which without a rewrite would be the
# request URI (/api/v1/orders) rather than the front controller. SCRIPT_NAME is
# pinned to /index.php for the same reason: Symfony derives the base URL from
# it, and a base URL of "/api/v1/orders" makes every generated link wrong.
#
# ---------------------------------------------------------------------
# Why SCRIPT_FILENAME points through `current`
#
# `current` is a symlink and swapping it is what makes a deploy atomic. Naming a
# release directory here would pin nginx to whichever release was live when it
# last reloaded, and the next deploy would serve old code until someone noticed.
#
# PHP's opcache is the other half of that: it keys entries by resolved realpath,
# so a symlink swap alone leaves workers running the previous release. srcp-deploy
# restarts php-fpm for exactly this reason, which is also why the pool may set
# opcache.validate_timestamps=0 — nothing changes underneath a running worker.

fastcgi_pass unix:/run/php/srcp-fpm.sock;
fastcgi_index index.php;

include fastcgi_params;

fastcgi_param SCRIPT_FILENAME /srv/srcp/current/apps/api/public/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param DOCUMENT_ROOT   /srv/srcp/current/apps/api/public;

# This host does not terminate TLS; the edge proxy does and forwards plain http.
# Laravel reads the HTTPS server variable before it looks at X-Forwarded-Proto,
# so leaving this to the fastcgi_params default tells the framework the reader is
# on http and it emits http:// URLs into an https page. $srcp_proto carries what
# the edge said — see srcp-proxy.conf for the full reasoning.
fastcgi_param HTTPS          $srcp_fcgi_https if_not_empty;
fastcgi_param REQUEST_SCHEME $srcp_proto;
fastcgi_param SERVER_PORT    $srcp_port;

# 120s matches request_terminate_timeout in the pool. If they disagree the
# shorter one wins and the longer one only produces a confusing error: nginx
# reports 504 while php-fpm reports nothing, or php-fpm kills a worker whose
# response nginx already gave up on.
fastcgi_read_timeout 120s;
fastcgi_send_timeout 120s;
fastcgi_connect_timeout 5s;

fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;

fastcgi_hide_header X-Powered-By;
