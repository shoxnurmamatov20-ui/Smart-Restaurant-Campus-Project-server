# Shared proxy headers for the two Next.js consoles.
#
# Installed to /etc/nginx/snippets/srcp-proxy.conf by srcp-apply.
#
# This used to be included by absolute path out of /home/pos/mypos-setup/render
# because the only privileged path available had no rule for /etc/nginx/snippets.
# It does now, and the file has moved: nginx parses its configuration as root, so
# a fragment living in a user's home meant anyone with that account could change
# what root reads. Same content, one fewer way to get owned.
#
# The one thing here that is not boilerplate is X-Forwarded-Proto. This host
# does not terminate TLS on port 80: the browser speaks https to an edge proxy
# (40.47.1.200, published as 87.237.235.107 / mypos.tashmedunitf.uz) and that
# proxy speaks plain http to us. If we set X-Forwarded-Proto from $scheme, as
# the stock snippet did, every request would arrive at Next.js and Laravel
# labelled "http" even though the reader is on https — which is how an app ends
# up emitting http:// URLs into an https page and tripping mixed content.
# $srcp_proto keeps whatever the edge said and falls back to our own scheme
# only when nobody said anything, which is the direct-to-LAN case.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $srcp_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $srcp_port;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_read_timeout 60s;
proxy_buffering on;

# Next.js announces itself in every response. srcp-fastcgi.conf hides the same
# header on the PHP side; this is the other half, so the stack is not named on
# the way out.
proxy_hide_header X-Powered-By;

# Next.js builds some Location headers from the origin it is actually listening
# on (127.0.0.1:3000). Strip that back to a path so the browser is not sent to
# a loopback address it cannot reach.
proxy_redirect ~^https?://(?:localhost|127\.0\.0\.1)(?::\d+)?(/.*)$ $1;
