; =====================================================================
; Smart Restaurant Campus — PHP production overrides
;
; Installed by srcp-apply to both:
;   /etc/php/8.4/fpm/conf.d/99-srcp.ini
;   /etc/php/8.4/cli/conf.d/99-srcp.ini
;
; Both, because the CLI SAPI is not a development detail here: Horizon, the
; scheduler and every artisan command run through it, and a memory_limit that
; applies to the web but not the queue is how a report that renders fine in the
; browser dies overnight in a job.
;
; Settings that must differ between the two live in the pool file instead
; (srcp-fpm-pool.conf), which only php-fpm reads.
; =====================================================================

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 3000

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; PHP's own date functions, not Laravel's. Laravel sets its timezone from
; config/app.php and works in Carbon; this is for everything underneath —
; file timestamps in logs, date() in a vendor package that never heard of
; Carbon. Keeping the two in agreement means a log line and a database row
; describing the same event carry the same hour.
date.timezone = Asia/Tashkent

; Assertions are a development construct; -1 compiles them out entirely rather
; than evaluating and discarding them.
zend.assertions = -1

; ---------------------------------------------------------------------
; OPcache
;
; max_accelerated_files is set well above the ~14,000 PHP files a --no-dev
; install of this application has, because the setting is rounded up to a prime
; and silently stops caching once the table is full: the symptom is not an
; error, it is a site that gets slower as more of it is visited.
;
; validate_timestamps is deliberately *not* set here. The web SAPI turns it off
; in the pool file because a release directory is immutable; the CLI must keep
; it on, or an artisan command run straight after an edit would execute the
; previous version of the file.
; ---------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Laravel and the module loader resolve a great many paths per request. This is
; the cheapest measurable win on a framework this size.
realpath_cache_size = 8M
realpath_cache_ttl = 600

; ---------------------------------------------------------------------
; Session cookies
;
; The application keeps sessions in Redis and issues its own cookie, so these
; govern only PHP's native session handler. Set anyway: an unset default is one
; forgotten `session_start()` away from mattering.
; ---------------------------------------------------------------------
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
