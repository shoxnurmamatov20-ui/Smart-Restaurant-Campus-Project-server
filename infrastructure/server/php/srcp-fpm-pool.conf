; =====================================================================
; Smart Restaurant Campus — php-fpm pool
;
; Installed to /etc/php/8.4/fpm/pool.d/srcp.conf by srcp-apply.
;
; This replaces `php artisan serve`, which is PHP's built-in development
; server and was the API's front end here until this pool existed. That server
; handles one request per worker with no process supervision and no opcache, so
; a single slow report blocked the tills behind it. The unit file that ran it
; said as much in its own header and named this as the fix.
; =====================================================================

[srcp]

; Runs as the service account, not as www-data and not as the human admin.
; www-data would share an identity with every other site the box ever hosts;
; `pos` has passwordless sudo and the SSH keys, so a remote-code hole in a menu
; endpoint would have handed over the whole machine. `srcp` owns the release
; tree and can write exactly one directory: /srv/srcp/shared.
user = srcp
group = srcp

; nginx opens the socket, so it is nginx's user that must be able to write to
; it — hence the ownership split. 0660 rather than 0666 keeps every other
; account on the box from talking straight to PHP and bypassing nginx entirely.
listen = /run/php/srcp-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ---------------------------------------------------------------------
; Process manager
;
; The arithmetic, so the next person can redo it rather than guess. This box
; has 7.8 GB. Standing costs: two Next.js servers ~350 MB, Horizon's ten
; workers ~800 MB, PostgreSQL ~200 MB, Redis ~50 MB, and the desktop session
; that is still installed ~1.5 GB. A booted Laravel request measures 60–90 MB
; RSS with opcache shared, so 24 children is ~2.2 GB against ~4.9 GB free.
;
; If the desktop is removed, or when this box stops being someone's terminal,
; 40 is comfortable. Raise it there and nowhere else — max_children is the one
; number that decides whether an overload degrades or swaps the box to death.
; ---------------------------------------------------------------------
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.process_idle_timeout = 30s

; Recycle workers periodically. Not because Laravel leaks — it is a guard
; against the one extension or one code path that does, which otherwise shows
; up as a box that is fine on Monday and swapping by Friday.
pm.max_requests = 500

; ---------------------------------------------------------------------
; Health and diagnosis
;
; Both are reachable on loopback only; the nginx site restricts them. srcp-health
; reads /fpm-ping to tell "php-fpm is up" apart from "the application is up",
; which is the difference between restarting a service and reading a stack trace.
; ---------------------------------------------------------------------
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; A request still running after 5s gets its stack written to the slow log — the
; only way to find out *where* a hung request is stuck rather than just that it
; was. 120s is the hard kill, and it matches fastcgi_read_timeout in nginx: if
; the two disagree the shorter wins and the longer only produces a confusing
; pair of logs that do not mention each other.
slowlog = /var/log/srcp/fpm-slow.log
request_slowlog_timeout = 5s
request_terminate_timeout = 120s

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /var/log/srcp/fpm-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; ---------------------------------------------------------------------
; Per-pool PHP settings
; ---------------------------------------------------------------------
php_admin_value[memory_limit] = 512M

; A release directory never changes after it is built, so there is nothing for
; opcache to revalidate — checking the mtime of every included file on every
; request is pure cost. This is safe only because srcp-deploy restarts php-fpm
; as part of every deploy; opcache keys entries by resolved realpath, so a
; symlink swap on its own would leave workers serving the previous release.
;
; The trap this sets: editing a file under /srv/srcp/current by hand changes
; nothing until php-fpm restarts. That is the intended behaviour for immutable
; releases and the usual reason someone is confused at 2am. `sudo systemctl
; restart php8.4-fpm` is the answer.
php_admin_value[opcache.validate_timestamps] = 0

; Confine the interpreter to the release tree, its scratch space and the fonts
; the PDF renderer needs. This is the difference between a path-traversal bug
; that leaks a menu file and one that reads /etc/shadow. If a package ever dies
; with "failed to open stream: operation not permitted", this list is the first
; place to look — add the path, do not delete the line.
php_admin_value[open_basedir] = /srv/srcp/:/tmp/:/var/tmp/:/usr/share/php/:/usr/share/fonts/:/dev/urandom

; Nothing reached over the web needs to start a process. The queue and the
; scheduler do — Horizon spawns workers, spatie/laravel-backup shells out to
; pg_dump — but those run through the CLI SAPI and are not affected by a pool
; setting. Web-facing PHP that can spawn a shell is how a file-upload bug
; becomes a reverse shell.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,proc_close,proc_get_status,proc_nice,popen,pcntl_exec,dl

security.limit_extensions = .php

; clear_env defaults to on, which strips PATH as well. Nothing here should need
; it, but a library that shells out to a binary it cannot find fails in a way
; that reads as "the binary is missing" rather than "the environment is empty".
env[PATH] = /usr/local/bin:/usr/bin:/bin
