apiVersion: v1
kind: Secret
metadata:
  name: restaurant-campus-secrets
  namespace: restaurant-campus
type: Opaque
stringData:
  APP_KEY: base64:replace-me
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_DATABASE: restaurant_campus
