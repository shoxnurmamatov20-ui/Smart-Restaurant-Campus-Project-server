apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-campus-web
  namespace: restaurant-campus
  labels:
    app.kubernetes.io/name: restaurant-campus-web
    app.kubernetes.io/part-of: smart-restaurant-campus
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: restaurant-campus-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restaurant-campus-web
        app.kubernetes.io/part-of: smart-restaurant-campus
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/restaurant-campus-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: '1'
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-campus-web
  namespace: restaurant-campus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: restaurant-campus-web
  ports:
    - name: http
      port: 3000
      targetPort: http
