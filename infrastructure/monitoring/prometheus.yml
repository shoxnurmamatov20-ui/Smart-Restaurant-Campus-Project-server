global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: campus-monitor
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:9000']

  - job_name: ai-services
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-services:8001']

  - job_name: web
    metrics_path: /api/metrics
    static_configs:
      - targets: ['web:3000']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
