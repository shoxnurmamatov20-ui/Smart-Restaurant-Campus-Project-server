name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== TypeScript / Next.js ==========
  ts-lint-test:
    name: TypeScript — Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # ========== Laravel / PHP ==========
  php-lint-test:
    name: Laravel — Lint, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, mbstring, openssl, bcmath, intl, gd
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel Pint (code style)
        working-directory: apps/api
        run: vendor/bin/pint --test

      - name: Run migrations
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: campus_test
          DB_USERNAME: campus
          DB_PASSWORD: campus
        run: php artisan migrate --force

      - name: Run tests
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: campus_test
          DB_USERNAME: campus
          DB_PASSWORD: campus
          REDIS_HOST: localhost
        run: php artisan test

  # ========== Python AI Services ==========
  python-lint-test:
    name: Python — Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: apps/ai-services
        run: uv sync --frozen

      - name: Run ruff
        working-directory: apps/ai-services
        run: uv run ruff check src/

      - name: Run mypy
        working-directory: apps/ai-services
        run: uv run mypy src/

      - name: Run pytest
        working-directory: apps/ai-services
        run: uv run pytest
