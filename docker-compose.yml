# ============================================================
# Smart Restaurant Campus — Local Development Environment
# ============================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d postgres redis  # Start only essentials
#   docker compose down               # Stop all
#   docker compose down -v            # Stop + delete volumes
#   docker compose logs -f <service>  # Follow logs
#
# Memory note: full stack uses ~4 GB RAM. On 8 GB systems,
# consider running only essentials (postgres + redis + minio).
# ============================================================

name: restaurant-campus

services:
  # ============ DATABASE — PostgreSQL 16 ============
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_campus
      POSTGRES_USER: restaurant_campus
      POSTGRES_PASSWORD: changeme
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restaurant_campus -d restaurant_campus']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ============ CACHE / QUEUE / SESSIONS — Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ============ ANALYTICS — ClickHouse ============
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: restaurant-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: restaurant_analytics
      CLICKHOUSE_USER: restaurant_campus
      CLICKHOUSE_PASSWORD: changeme
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '8123:8123' # HTTP
      - '9009:9000' # Native (mapped to 9009 to avoid clash with MinIO)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8123/ping']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ============ OBJECT STORAGE — MinIO (S3-compatible) ============
  minio:
    image: minio/minio:latest
    container_name: restaurant-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: localhost
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 512M

  # MinIO bucket auto-creator (runs once at start)
  minio-init:
    image: minio/mc:latest
    container_name: restaurant-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/restaurant-campus;
      mc anonymous set download local/restaurant-campus;
      echo 'MinIO bucket created.';
      "
    networks:
      - restaurant-net

  # ============ SSO / IDENTITY — Keycloak ============
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: restaurant-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: restaurant_campus
      KC_DB_PASSWORD: changeme
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
    ports:
      - '8090:8080' # Keycloak Admin UI (8080 reserved for Reverb)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ============ MAIL TESTING — Mailpit (modern Mailhog) ============
  mailpit:
    image: axllent/mailpit:latest
    container_name: restaurant-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    volumes:
      - mailpit_data:/data
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ FULL-TEXT SEARCH — Meilisearch ============
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: restaurant-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: changeme-please-32-chars-or-more-key
      MEILI_NO_ANALYTICS: true
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:7700/health']
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ MONITORING (optional) — Prometheus ============
  prometheus:
    image: prom/prometheus:latest
    container_name: restaurant-prometheus
    restart: unless-stopped
    profiles: ['monitoring']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ ALERTING (optional) — Alertmanager ============
  alertmanager:
    image: prom/alertmanager:latest
    container_name: restaurant-alertmanager
    restart: unless-stopped
    profiles: ['monitoring']
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '9093:9093'
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ EXPORTER (optional) — PostgreSQL metrics ============
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: restaurant-postgres-exporter
    restart: unless-stopped
    profiles: ['monitoring']
    environment:
      DATA_SOURCE_NAME: postgresql://restaurant_campus:changeme@postgres:5432/restaurant_campus?sslmode=disable
    ports:
      - '9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ EXPORTER (optional) — Redis metrics ============
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: restaurant-redis-exporter
    restart: unless-stopped
    profiles: ['monitoring']
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - '9121:9121'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ EXPORTER (optional) — Host metrics ============
  node-exporter:
    image: prom/node-exporter:latest
    container_name: restaurant-node-exporter
    restart: unless-stopped
    profiles: ['monitoring']
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - '9100:9100'
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ MONITORING (optional) — Grafana ============
  grafana:
    image: grafana/grafana-oss:latest
    container_name: restaurant-grafana
    restart: unless-stopped
    profiles: ['monitoring']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - '3030:3000' # Grafana on 3030 (3000 reserved for Next.js web)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ LOGS (optional) — Loki ============
  loki:
    image: grafana/loki:latest
    container_name: restaurant-loki
    restart: unless-stopped
    profiles: ['monitoring']
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'
    volumes:
      - loki_data:/loki
    networks:
      - restaurant-net
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
  mailpit_data:
  meilisearch_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:

networks:
  restaurant-net:
    driver: bridge
    name: restaurant-net
