[project]
name = "restaurant-campus-ai-services"
version = "0.0.0"
description = "Smart Restaurant Campus — AI/ML microservices (menu assistant, demand forecast, food vision, review sentiment, staff face ID)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Smart Restaurant Campus Team", email = "uzbcorp@gmail.com" }]

dependencies = [
    # ============ Web framework ============
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",

    # ============ Config & data ============
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",

    # ============ HTTP client ============
    "httpx>=0.28.0",
    "tenacity>=9.0.0",                    # Retries

    # ============ AI / LLM ============
    "anthropic>=0.42.0",                  # Claude API
    "openai>=1.59.0",                     # OpenAI API

    # ============ Database ============
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",                    # Postgres async driver
    "alembic>=1.14.0",                    # Migrations
    "redis>=5.2.0",

    # ============ Logging ============
    "structlog>=24.5.0",

    # ============ Observability ============
    "prometheus-fastapi-instrumentator>=7.0.0",
    "sentry-sdk[fastapi]>=2.20.0",

    # ============ Security ============
    "python-jose[cryptography]>=3.3.0",   # JWT verification
    "passlib[bcrypt]>=1.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",                       # For test client
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "types-redis>=4.6.0",
    "ipython>=8.30.0",
]

# ============ Optional / feature-specific ============
# Install when implementing the corresponding modules:
#
# Review sentiment:          uv add sentence-transformers
# Face recognition (modul 21): uv add opencv-python face-recognition
# Demand forecast:           uv add scikit-learn lightgbm pandas numpy
# Chart generation:           uv add matplotlib plotly
# OCR (kirim hujjatlari):      uv add pytesseract pillow

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "S101",  # asserts allowed in tests
    "S104",  # 0.0.0.0 binding OK for containerized
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
