packages:
  - 'apps/web'
  - 'apps/admin'
  - 'apps/mobile'
  - 'packages/*'

# Allow these native modules to run install scripts (security feature in pnpm 10+)
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@tailwindcss/oxide'
  - esbuild
  - '@swc/core'
  - core-js

# Catalog: pin shared versions across all workspace packages
catalog:
  react: ^19.2.6
  react-dom: ^19.2.6
  next: ^16.2.6
  typescript: ^6.0.3
  '@types/node': ^25.9.1
  '@types/react': ^19.2.15
  '@types/react-dom': ^19.2.3
  tailwindcss: ^4.3.0
  '@tailwindcss/postcss': ^4.3.0
  eslint: ^10.4.0
  zod: ^4.4.3
  '@tanstack/react-query': ^5.100.14
  zustand: ^5.0.13
  'react-hook-form': ^7.76.1
  'next-intl': ^4.12.0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  '@swc/core': true
  '@parcel/watcher': true

# Note: apps/api (Laravel) uses Composer, not pnpm
# Note: apps/ai-services (Python) uses uv, not pnpm
