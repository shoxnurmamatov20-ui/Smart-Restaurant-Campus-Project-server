packages:
  - 'apps/web'
  - 'apps/admin'
  - 'packages/*'

# Note: apps/mobile is Phase 2 and holds only a README — it has no package.json,
# so listing it here would be a workspace entry pointing at nothing. Add it back
# in the same commit that adds the Expo app.
#
# The till used to be a third app here (apps/pos, port 3002). It was folded back
# into the staff console: POS is module 12, and a module is a section of
# apps/web, not an application of its own — see ADR-0011.

# Allow these native modules to run install scripts (security feature in pnpm 10+)
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@tailwindcss/oxide'
  - esbuild
  - '@swc/core'
  - core-js

# Catalog: pin shared versions across all workspace packages
catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  next: ^16.3.0
  typescript: ^6.0.3
  '@types/node': ^25.9.5
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  eslint: ^10.8.1
  zod: ^4.4.3
  '@tanstack/react-query': ^5.101.4
  zustand: ^5.0.14
  'react-hook-form': ^7.85.0
  'next-intl': ^4.13.6

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  '@swc/core': true
  '@parcel/watcher': true

# Note: apps/api (Laravel) uses Composer, not pnpm
# Note: apps/ai-services (Python) uses uv, not pnpm
